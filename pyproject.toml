[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-localizer"
version = "0.1.0"
description = "Minecraft modpack localization patch generator with OpenAI-compatible APIs"
requires-python = ">=3.10"

[project.scripts]
mc-localizer = "mc_localizer.cli:main"
mc-localizer-gui = "mc_localizer.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mc_localizer*"]
